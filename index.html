<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>Em có thích tôi không?</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 24px;
      padding: 28px 18px;
      overflow: hidden;
      position: relative;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #fff0f6 0%, #ffe0ed 50%, #ffd6e7 100%);
    }

    body::before, body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(65px);
      pointer-events: none;
    }
    body::before {
      width: 360px; height: 360px; top: -120px; left: -100px;
      background: rgba(255,255,255,.65);
    }
    body::after {
      width: 340px; height: 340px; right: -100px; bottom: -130px;
      background: rgba(255,105,180,.20);
    }

    #gif {
      display: block;
      width: min(280px, 68vw);
      max-height: 290px;
      object-fit: contain;
      border-radius: 20px;
      position: relative;
      z-index: 1;
      animation: floating 3s ease-in-out infinite;
      filter: drop-shadow(0 10px 15px rgba(255,105,180,.16));
    }

    #question {
      position: relative;
      z-index: 1;
      max-width: 900px;
      font-family: 'Pacifico', cursive;
      font-size: clamp(25px, 4vw, 39px);
      line-height: 1.5;
      color: #ff3f85;
      text-shadow: 2px 3px 0 #fff;
      animation: fadeIn .8s ease;
    }

    .button-group {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 4px;
      min-height: 56px;
    }

    .btn {
      min-width: 120px;
      padding: 12px 28px;
      border: 0;
      border-radius: 50px;
      font: 600 16px 'Poppins', sans-serif;
      cursor: pointer;
      transition: transform .22s ease, box-shadow .22s ease, background .22s ease;
    }
    .btn-yes {
      color: #fff;
      background: linear-gradient(135deg, #ff4d88, #ff78a5);
      box-shadow: 0 7px 18px rgba(255,77,136,.30);
    }
    .btn-yes:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 10px 22px rgba(255,77,136,.4); }
    .btn-no {
      color: #ff4d88;
      background: #fff;
      border: 2px solid #ff8fb5;
      box-shadow: 0 6px 15px rgba(255,143,181,.2);
    }
    .btn-no:hover { background: #fff0f6; }

    .heart {
      position: fixed;
      bottom: -40px;
      z-index: 0;
      pointer-events: none;
      animation: rise linear forwards;
      opacity: .8;
    }
    .success {
      color: #ff2f7d !important;
    }
    .hidden { display: none !important; }

    @keyframes floating {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes rise {
      from { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: .85; }
      to { transform: translateY(-115vh) rotate(25deg); opacity: 0; }
    }

    @media (max-width: 480px) {
      body { gap: 20px; padding: 20px 12px; }
      #gif { width: min(230px, 65vw); }
      #question { font-size: 25px; }
      .button-group { gap: 12px; }
      .btn { min-width: 100px; padding: 11px 20px; font-size: 15px; }
    }
  </style>
</head>

      heart.style.fontSize = (16 + Math.random() * 22) + 'px';
      heart.style.animationDuration = (4 + Math.random() * 4) + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 8500);
    }
    setInterval(createHeart, 650);

    noBtn.addEventListener('click', () => {
      question.textContent = noMessages[noCount % noMessages.length];
      noCount++;
      // Nút Không dịch chuyển nhẹ nhưng vẫn có thể bấm.
      const dx = Math.round((Math.random() - 0.5) * 100);
      const dy = Math.round((Math.random() - 0.5) * 35);
      noBtn.style.transform = `translate(${dx}px, ${dy}px)`;
      yesBtn.style.transform = `scale(${Math.min(1.18, 1 + noCount * 0.025)})`;
    });

    yesBtn.addEventListener('click', () => {
      // Đổi giao diện ngay lập tức; nhạc được thử phát song song để không chặn hiệu ứng.
      question.textContent = 'Tôi biết em cũng thích tôi mà! 💖';
      question.classList.add('success');
      gif.src = 'https://media.tenor.com/0AVbKGY_MxMAAAAi/bear-love.gif';
      gif.alt = 'Gấu dễ thương mừng vì em đã đồng ý';
      buttonGroup.classList.add('hidden');

      bgMusic.currentTime = 0;
      const playAttempt = bgMusic.play();
      if (playAttempt && typeof playAttempt.catch === 'function') {
        playAttempt.catch((error) => {
          console.warn('Nhạc chưa phát được. Hãy kiểm tra file nhac.mp3 có nằm cạnh file HTML không.', error);
        });
      }

      for (let i = 0; i < 25; i++) setTimeout(createHeart, i * 90);
    });
  </script>
</body>
</html>
